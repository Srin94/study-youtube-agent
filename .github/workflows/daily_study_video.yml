name: Daily Study Video Agent

on:
  schedule:
    - cron: '17 6 * * *' # Daily at 06:17 UTC (11:47 AM IST). Odd minute, off the
      # busy :00/:30 marks so GitHub is less likely to delay or drop it.
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom study topic (blank = next curriculum topic)'
        required: false
        default: ''

permissions:
  contents: write
  models: read   # lets the built-in GITHUB_TOKEN call GitHub Models (free LLM fallback)

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Audio & Browser Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent-backend/requirements.txt

      - name: Install Python Packages & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-backend/requirements.txt
          playwright install --with-deps chromium

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: video-engine/package.json

      - name: Install Remotion Video Engine Dependencies
        run: |
          cd video-engine
          npm install

      - name: Execute End-to-End Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Fallback LLM providers (src/llm_providers.py): whichever are set are
          # tried in order when Gemini is overloaded (503) or quota-exhausted
          # (429); unset ones are skipped. The built-in GITHUB_TOKEN + the
          # `models: read` permission above give free GitHub Models access with
          # NO extra secret. Add GROQ_API_KEY / OPENROUTER_API_KEY secrets for
          # more headroom.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CHANNEL_NAME: "First Principles"
          APPROVAL_WINDOW_MINUTES: "60"
          APPROVE_ON_TIMEOUT: "false"
        run: |
          cd agent-backend
          if [ -n "${{ github.event.inputs.custom_topic }}" ]; then
            python main.py --topic "${{ github.event.inputs.custom_topic }}"
          else
            python main.py
          fi

      - name: Upload Render Artifacts (thumbnail + video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-outputs
          path: |
            agent-backend/output/thumbnail.png
            agent-backend/output/thumbnail_filled.html
            agent-backend/output/final_video.mp4
            agent-backend/output/render_payload.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit Updated SQLite Deduplication Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent-backend/data/seen_topics.db
          git diff --staged --quiet || git commit -m "chore: record published study topic in seen_topics.db [skip ci]"
          git push
