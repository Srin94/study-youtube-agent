<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --canvas-bg: __CANVAS_BG__;
        --canvas-bg2: __CANVAS_BG2__;
        --card-bg: __CARD_BG__;
        --grid: __GRID__;
        --text-primary: __TEXT_PRIMARY__;
        --text-muted: __TEXT_MUTED__;
        --accent: __ACCENT__;
        --accent-2: __ACCENT_2__;
        --accent-critical: __ACCENT_CRITICAL__;
        --ink: __INK__;
        --font-heading: __FONT_HEADING__;
        --font-mono: __FONT_MONO__;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; }

      body {
        position: relative;
        background: linear-gradient(135deg, var(--canvas-bg2) 0%, var(--canvas-bg) 60%);
        font-family: var(--font-heading);
        color: var(--text-primary);
        overflow: hidden;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.6;
      }

      .layout {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 440px;
        align-items: center;
        padding: 64px 70px;
        gap: 44px;
      }

      .left { display: flex; flex-direction: column; gap: 26px; }

      .badge {
        align-self: flex-start;
        display: inline-flex; align-items: center; gap: 12px;
        background: var(--accent);
        color: #fff;
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 26px;
        letter-spacing: 3px;
        text-transform: uppercase;
        padding: 10px 22px;
        border: 2px solid var(--ink);
        box-shadow: __HARD_SHADOW__;
      }

      .headline {
        font-size: 100px;
        line-height: 0.95;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -2px;
        max-width: 720px;
      }
      .headline .hl {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        padding: 0 16px;
        margin-top: 10px;
        box-shadow: __HARD_SHADOW__;
        transform: rotate(-1.5deg);
      }

      .brand { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
      .brand .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
      .brand .name {
        font-family: var(--font-mono);
        font-size: 26px; letter-spacing: 5px; font-weight: 700;
        text-transform: uppercase; color: var(--text-muted);
      }

      /* Right-hand text contrast composition */
      .right { display: flex; flex-direction: column; align-items: stretch; gap: 18px; }
      .tile {
        background: var(--card-bg);
        border: 3px solid var(--accent);
        border-radius: 16px;
        padding: 30px 28px;
        min-height: 150px;
        display: flex; align-items: center; justify-content: center;
        text-align: center;
        box-shadow: __HARD_SHADOW__;
        font-family: var(--font-heading);
        font-weight: 800;
        font-size: 40px;
        line-height: 1.05;
        color: var(--text-primary);
      }
      .tile.alt { border-color: var(--accent-2); }
      .tile.alt.critical { border-color: var(--accent-critical); color: var(--accent-critical); }

      .connector {
        align-self: center;
        font-size: 64px; font-weight: 900; line-height: 1;
        color: var(--accent);
      }
      .connector.critical { color: var(--accent-critical); }
    </style>
  </head>
  <body>
    <div class="grid"></div>

    <div class="layout">
      <div class="left">
        <div class="badge">__BADGE_TEXT__</div>
        <div class="headline">__HEADLINE_HTML__</div>
        <div class="brand">
          <div class="dot"></div>
          <div class="name">__CHANNEL_NAME__</div>
        </div>
      </div>

      <div class="right">
        <div class="tile">__LEFT_LABEL__</div>
        <div class="connector __CONNECTOR_CLASS__">__CONNECTOR_GLYPH__</div>
        <div class="tile alt __CONNECTOR_CLASS__">__RIGHT_LABEL__</div>
      </div>
    </div>
  </body>
</html>
